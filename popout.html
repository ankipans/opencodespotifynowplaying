<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Now Playing</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./popout.css">
</head>
<body>
  <div class="bg" aria-hidden="true"><div id="bg-art" class="bg-art"></div><div class="bg-overlay"></div></div>
  <main class="popout" id="popout">
    <div class="art-wrap">
      <img id="art" class="art" alt="" />
      <div id="art-empty" class="art-empty" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
      </div>
    </div>
    <div class="info">
      <p id="status" class="status">Idle</p>
      <h1 id="title" class="title">Nothing playing</h1>
      <p id="artist" class="artist">Open the main Spotify Now Playing page.</p>
      <p id="album" class="album"></p>
      <div class="progress-wrap">
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        <div class="progress-times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
      </div>
    </div>
  </main>
  <script src="./popout.js"></script>
</body>
</html>
